<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Banking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="atm-container">
    <h1>🏧 ATM Banking System</h1>
    <p class="subtitle">Welcome to Secure Banking</p>

    <section id="login">
        <h2>Login</h2>
        <input type="password" id="pin" placeholder="Enter 4-digit PIN"
               inputmode="numeric" maxlength="4">
        <button onclick="login()">Login</button>
        <p id="loginMessage"></p>
        <small>Demo PIN: 1234</small>
    </section>

    <section id="dashboard" class="hidden">
        <h2>ATM Dashboard</h2>

        <div class="balance-card">
            <p>Available Balance</p>
            <h2 id="balance">₹10,000.00</h2>
        </div>

        <input type="number" id="amount"
               placeholder="Enter amount (₹)" min="1">

        <div class="buttons">
            <button onclick="checkBalance()">Check Balance</button>
            <button onclick="withdraw()">Withdraw</button>
            <button onclick="deposit()">Deposit</button>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <p id="message" aria-live="polite"></p>

        <h3>Transaction History</h3>
        <ul id="history"></ul>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
